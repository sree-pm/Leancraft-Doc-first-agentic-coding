name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run verify
      - name: Confirm matching release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const v=require('./package.json').version;if(process.env.RELEASE_TAG !== 'v'+v)process.exit(1)"

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - name: Publish with npm trusted publishing (OIDC)
        run: npm publish --access public
      - name: Create GitHub release only after npm publish succeeds
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
